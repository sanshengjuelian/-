<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词创作库</title>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --text:#1f2328; --muted:#6b7280; --line:#e2e6ec;
  --brand:#4d8fd4; --brand2:#3b6ea8; --accent:#ff7fae; --tagbg:#eef3fa; --tagfg:#3b6ea8;
  --hover:#f3f7fc; --shadow:0 1px 4px rgba(20,40,80,.08); --media:#0d1b2a;
}
[data-theme="dark"]{
  --bg:#0f1419; --card:#171d24; --text:#e6eaf0; --muted:#8b96a5; --line:#262e38;
  --brand:#6aa9e8; --brand2:#8fc0f0; --accent:#ff8fbc; --tagbg:#1d2733; --tagfg:#8fc0f0;
  --hover:#1d2733; --shadow:0 1px 4px rgba(0,0,0,.4); --media:#05090f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--brand);color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:var(--brand2)}
button.danger{color:#d64545;border-color:#d64545}
input[type=text],select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}

#sidebar{width:250px;min-width:250px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;height:100vh;position:sticky;top:0;overflow-y:auto;gap:10px}
#sidebar .logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
#sidebar .logo span{color:var(--brand)}
#sidebar .search input{width:100%}
#sidebar h3{font-size:12px;color:var(--muted);margin:8px 0 4px}
#catList,#tagList{display:flex;flex-direction:column;gap:2px}
#catList button,#tagList button{text-align:left;border:none;background:none;padding:6px 9px;border-radius:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#catList button.active,#tagList button.active{background:var(--tagbg);color:var(--tagfg);font-weight:600}
#catList button:hover,#tagList button:hover{background:var(--hover);color:var(--text)}
#tagList{flex-direction:row;flex-wrap:wrap;gap:4px}
#tagList button{font-size:12px;padding:3px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
#tagList button.active{background:var(--tagbg);border-color:var(--brand);color:var(--tagfg)}
#sidebar .actions{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.themeRow{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.theme-switch{position:relative;width:40px;height:22px;background:var(--line);border-radius:12px;cursor:pointer;transition:.2s}
.theme-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
[data-theme="dark"] .theme-switch{background:var(--brand)}
[data-theme="dark"] .theme-switch::after{left:20px}

#main{flex:1;padding:18px 22px;overflow-y:auto;height:100vh}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .count{color:var(--muted);font-size:13px}
.toolbar .right{margin-left:auto;display:flex;gap:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card-media{position:relative;aspect-ratio:16/9;background:var(--media);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover}
.img-preview{position:fixed;z-index:60;pointer-events:none;background:#0d1b2a;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.img-preview img{max-width:300px;max-height:340px;object-fit:contain;border-radius:6px}
.card-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-media iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.card-media .ph{color:#7d8ea0;font-size:12px;text-align:center;padding:8px}
.card-media .ph .play{font-size:26px;margin-bottom:4px}
.card-body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-title .cat{font-size:10px;background:var(--tagbg);color:var(--tagfg);padding:1px 8px;border-radius:20px;font-weight:400}
.copy-btn{margin-left:auto;border:none;background:var(--hover);color:var(--muted);font-size:12px;padding:3px 8px;border-radius:6px;cursor:pointer;flex-shrink:0}
.copy-btn:hover{background:var(--tagbg);color:var(--tagfg)}
.card.copying{outline:2px solid var(--brand);outline-offset:-2px}
.card-prompt{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;line-height:1.5;flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;background:var(--tagbg);color:var(--tagfg);padding:1px 7px;border-radius:12px}
.card-empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:780px;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%}
.modal textarea{min-height:80px;resize:vertical;line-height:1.5}
.modal .row{display:flex;gap:12px}
.modal .row>div{flex:1}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn-row .left{margin-right:auto}
.mediaBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mediaAdd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mediaItem{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--hover)}
.mediaItem img,.mediaItem video{width:110px;height:70px;object-fit:cover;display:block}
.mediaItem .mi-info{font-size:11px;color:var(--muted);padding:3px 6px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mediaItem .mi-rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer}
.d-block{margin-top:12px}
.d-block h4{font-size:12px;color:var(--muted);margin-bottom:5px}
.d-prompt,.d-script{background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;line-height:1.6;font-size:13px}
.d-prompt{font-family:Consolas,monospace}
.d-media{display:flex;gap:8px;flex-wrap:wrap}
.d-media .mediaItem img,.d-media .mediaItem video{width:150px;height:95px}
.d-video a{color:var(--brand);word-break:break-all}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:.95}
@media(max-width:820px){#sidebar{width:200px;min-width:200px}}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="logo">⛵ 提示词<span>创作库</span></div>
  <div class="search"><input type="text" id="searchBox" placeholder="🔍 搜索…"></div>
  <h3>分类</h3>
  <div id="catList"></div>
  <h3>标签</h3>
  <div id="tagList"></div>
  <div class="actions">
    <button id="btnNew" class="primary">＋ 新建条目</button>
    <button id="btnExport">导出 JSON</button>
    <button id="btnImport">导入 JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <div class="themeRow"><span>黑夜模式</span><div class="theme-switch" id="themeSwitch"></div></div>
  </div>
</aside>

<main id="main">
  <div class="toolbar">
    <span class="count" id="countInfo">0 条</span>
    <span class="right"><button id="btnAddCat">＋ 分类</button></span>
  </div>
  <div id="grid"></div>
</main>

<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h2><span id="editorTitle">新建条目</span><button class="danger" id="btnCloseEditor">✕</button></h2>
    <label>标题 *</label><input type="text" id="f_title" placeholder="例如：鲸鱼娘三视图 · 通用模板">
    <div class="row">
      <div><label>分类</label><select id="f_cat"></select></div>
      <div><label>标签（逗号分隔）</label><input type="text" id="f_tags" placeholder="三视图,鲸鱼娘,二次元"></div>
    </div>
    <label>素材（图片 / 本地视频 / 视频链接）</label>
    <div class="mediaBar" id="editorMedia"></div>
    <div class="mediaAdd">
      <button id="btnAddImg">🖼️ 上传图片</button>
      <button id="btnAddVid">🎬 上传本地视频</button>
      <input type="file" id="imgFile" accept="image/*" style="display:none">
      <input type="file" id="vidFile" accept="video/*" style="display:none">
      <input type="text" id="f_vlink" placeholder="B站/YouTube 链接…" style="flex:1;min-width:180px">
      <button id="btnAddLink">🔗 添加链接</button>
    </div>
    <label>提示词</label><textarea id="f_prompt" placeholder="提示词全文…"></textarea>
    <label>剧本 / 分镜 / 备注</label><textarea id="f_script" placeholder="剧情、分镜、使用说明…"></textarea>
    <div class="btn-row"><button class="danger left" id="btnDelete">删除</button><button id="btnCancel">取消</button><button class="primary" id="btnSave">保存</button></div>
  </div>
</div>

<div class="modal-mask" id="detailMask">
  <div class="modal">
    <h2><span id="d_title"></span><button class="danger" id="btnCloseDetail">✕</button></h2>
    <div id="d_meta"></div>
    <div class="d-block" id="d_mediaBlock"><h4>素材</h4><div class="d-media" id="d_media"></div></div>
    <div class="d-block"><h4>提示词</h4><div class="d-prompt" id="d_prompt"></div></div>
    <div class="d-block" id="d_scriptBlock"><h4>剧本 / 备注</h4><div class="d-script" id="d_script"></div></div>
    <div class="btn-row"><button id="btnEdit">✏️ 编辑</button><button id="btnCopy">📋 复制提示词</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORE_KEY='promptlib_v1';
let state={entries:[],categories:['通用提示词','特定场景','剧本分镜','参考库'],activeCat:'',activeTag:'',search:'',editingId:null};

const SEED=[
 {id:1,title:'三视图 · 角色设定通用模板',category:'通用提示词',tags:['三视图','角色设定'],media:[],prompt:'角色三视图设定图：从左到右依次为正面全身、侧面全身、背面全身，并排居中，右上角放一个头部特写。角色：〔角色描述：发型/发色/瞳色/服装/配饰/标志性特征〕。三个视图的发型、服装、配色、特征完全一致。纯白背景，无文字，无水印，赛璐璐动画风格，高清。',script:'用法：复制后替换〔角色描述〕。进阶：先出单张正面立绘，再以此立绘为参考图生成三视图，成功率更高。',date:'2026-08-20'},
 {id:2,title:'温馨客厅 · 场景底图',category:'特定场景',tags:['客厅','场景','9:16'],media:[],prompt:'温馨治愈的简约现代客厅，暖色调。浅色布艺沙发靠墙摆放，中间木质小茶几，茶几上一杯热茶。木地板，墙角一盏暖黄落地灯，窗边透进柔和自然光。画面干净简洁，家具少，留出大片活动空间。中景，正面视角，9:16 竖屏。暖黄室内光 3200K，柔光，轻微胶片颗粒，电影感，高清。无人物，无文字，无水印。',script:'底图提示词。多角度扩展：把底图当参考图（图生图），只改机位句。',date:'2026-08-20'},
 {id:3,title:'多角度扩展 · 场景模板',category:'通用提示词',tags:['多角度','机位','参考图'],media:[],prompt:'以参考图为基准，场景元素完全不变，只改变拍摄机位角度，画风与光影氛围保持一致。\n角度1 广角全景：…\n角度2 中景平视：…\n角度3 特写：…\n角度4 低角度仰拍：…\n角度5 高角度俯拍：…',script:'配合底图使用：底图设为参考图，逐条替换机位描述。',date:'2026-08-20'},
 {id:4,title:'剧本分镜模板',category:'剧本分镜',tags:['剧本','分镜'],media:[],prompt:'',script:'【场景】\n【时间】\n【镜头】\n【画面描述】\n【对白/音效】\n【参考视频】\n---\n每行一个镜头，生成视频时逐镜出图再拼接。',date:'2026-08-20'},
 {id:5,title:'参考视频示例',category:'参考库',tags:['示例'],media:[{kind:'link',url:'https://www.bilibili.com/video/BV1s56HY5Ek8'}],prompt:'示例：悬停卡片可预览视频',script:'把鼠标移到卡片上方视频区域即可播放预览。',date:'2026-08-20'}
];

let _db=null;
function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open('promptlib_media',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'});};r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
async function putMedia(blob,name,mime){const db=await openDB();const id='m'+Date.now()+Math.floor(Math.random()*1e5);await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,blob,name,mime});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});return id;}
async function getMedia(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const rq=tx.objectStore('files').get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}
async function delMedia(id){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
const objUrls=new Map();
async function mediaUrl(m){if(m.kind!=='image'&&m.kind!=='video')return null;if(objUrls.has(m.id))return objUrls.get(m.id);const rec=await getMedia(m.id);if(!rec)return null;const u=URL.createObjectURL(rec.blob);objUrls.set(m.id,u);return u;}

function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){state=JSON.parse(raw);}else{state.entries=SEED;save();}}
  catch(e){state.entries=SEED;}
  state.entries.forEach(e=>{if(!e.media)e.media=[];});
  if(!Array.isArray(state.categories)||!state.categories.length)state.categories=['通用提示词','特定场景','剧本分镜','参考库'];
}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function embedUrl(url,autoplay){
  const bv=url.match(/BV[0-9A-Za-z]{10}/);if(bv)return 'https://player.bilibili.com/player.html?bvid='+bv[0]+'&page=1'+(autoplay?'&autoplay=1':'');
  const yt=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);if(yt)return 'https://www.youtube.com/embed/'+yt[1]+(autoplay?'?autoplay=1':'');
  return null;
}
function applyTheme(){document.documentElement.setAttribute('data-theme',localStorage.getItem('promptlib_theme')==='dark'?'dark':'light');}
function toggleTheme(){localStorage.setItem('promptlib_theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');applyTheme();}

function renderCats(){
  const list=document.getElementById('catList');
  list.innerHTML='<button class="'+(state.activeCat===''?'active':'')+'" data-cat="">全部</button>'+state.categories.map(c=>`<button class="${state.activeCat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  list.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.activeCat=b.dataset.cat;renderCats();renderList();});
  document.getElementById('f_cat').innerHTML=state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
function renderTags(){
  const all=new Map();
  state.entries.forEach(e=>(e.tags||[]).forEach(t=>all.set(t,(all.get(t)||0)+1)));
  const list=document.getElementById('tagList');
  list.innerHTML='<button class="'+(state.activeTag===''?'active':'')+'" data-tag="">全部</button>'+[...all.entries()].sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<button class="${state.activeTag===t?'active':''}" data-tag="${esc(t)}">${esc(t)} ${n}</button>`).join('');
  list.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.activeTag=b.dataset.tag;renderTags();renderList();});
}
function filtered(){
  const q=state.search.trim().toLowerCase();
  return state.entries.filter(e=>{
    if(state.activeCat&&e.category!==state.activeCat)return false;
    if(state.activeTag&&!(e.tags||[]).includes(state.activeTag))return false;
    if(!q)return true;
    return (e.title+' '+(e.prompt||'')+' '+(e.script||'')+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q);
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function vidLabel(u){return u.includes('bilibili')?'B站视频':(u.includes('youtu')?'YouTube':'视频链接');}
async function fillCardMedia(card,entry){
  const box=card.querySelector('.card-media');if(!box)return;
  const m=entry.media&&entry.media[0];
  if(!m){box.innerHTML='<div class="ph">📝 纯提示词</div>';return;}
  if(m.kind==='link'){
    const url=m.url||'';
    box.innerHTML=`<div class="ph"><div class="play">▶</div>${vidLabel(url)} · 悬停播放</div>`;
    box.addEventListener('mouseenter',()=>{
      const src=embedUrl(url,true);
      if(!src){box.innerHTML='<div class="ph">▶ 不支持内嵌</div>';return;}
      box.innerHTML='<iframe src="'+src+'" allow="autoplay; fullscreen" scrolling="no" frameborder="0"></iframe>';
    });
    box.addEventListener('mouseleave',()=>{box.innerHTML=`<div class="ph"><div class="play">▶</div>${vidLabel(url)} · 悬停播放</div>`;});
    return;
  }
  const u=await mediaUrl(m);
  if(m.kind==='image'){
    if(!u){box.innerHTML='<div class="ph">图片缺失</div>';return;}
    box.innerHTML=`<img src="${u}" alt="">`;
    const img=box.querySelector('img');
    box.addEventListener('mouseenter',()=>showImgPreview(u,img));
    box.addEventListener('mousemove',e=>moveImgPreview(e));
    box.addEventListener('mouseleave',hideImgPreview);
  }else{
    if(!u){box.innerHTML='<div class="ph">视频缺失</div>';return;}
    /* 先加载视频抓取首帧作封面，悬停时播放 */
    const v=document.createElement('video');
    v.src=u;v.muted=true;v.playsInline=true;v.preload='auto';
    let frameData=null;
    v.onloadeddata=()=>{
      try{v.currentTime=0.05;}catch(e){}
      v.onseeked=()=>{
        try{
          const c=document.createElement('canvas');
          c.width=v.videoWidth||320;c.height=v.videoHeight||180;
          c.getContext('2d').drawImage(v,0,0,c.width,c.height);
          frameData=c.toDataURL('image/jpeg',0.7);
          box.innerHTML='<img src="'+frameData+'" alt="">';
          box.addEventListener('mouseenter',()=>{const p=document.createElement('video');p.src=u;p.muted=true;p.playsInline=true;p.autoplay=true;p.loop=true;box.innerHTML='';box.appendChild(p);p.play().catch(()=>{});});
          box.addEventListener('mouseleave',()=>{box.innerHTML='<img src="'+frameData+'" alt="">';});
        }catch(e){box.innerHTML='<div class="ph"><div class="play">▶</div>本地视频 · 悬停播放</div>';}
      };
    };
    v.onerror=()=>{box.innerHTML='<div class="ph"><div class="play">▶</div>本地视频 · 悬停播放</div>';};
    v.load();
  }
}
async function renderList(){
  const grid=document.getElementById('grid');
  const items=filtered();
  document.getElementById('countInfo').textContent=items.length+' 条'+(state.search||state.activeCat||state.activeTag?'（已筛选）':'');
  if(!items.length){grid.innerHTML='<div class="card-empty">没有匹配的条目，点击左侧「＋ 新建条目」开始记录</div>';return;}
  grid.innerHTML=items.map(e=>`<div class="card" data-id="${e.id}">
    <div class="card-media"><div class="ph">加载中…</div></div>
    <div class="card-body">
      <div class="card-title">${esc(e.title)} <span class="cat">${esc(e.category||'')}</span>${e.prompt?`<button class="copy-btn" title="复制提示词">📋 复制</button>`:''}</div>
      ${e.prompt?`<div class="card-prompt">${esc(e.prompt)}</div>`:''}
      ${(e.tags||[]).length?`<div class="card-tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
  </div>`).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.onclick=ev=>{if(ev.target.closest('iframe')||ev.target.closest('video')||ev.target.closest('.copy-btn'))return;openDetail(Number(card.dataset.id));};
    const cb=card.querySelector('.copy-btn');
    if(cb)cb.onclick=ev=>{
      ev.stopPropagation();
      const e=state.entries.find(x=>x.id===Number(card.dataset.id));
      if(!e||!e.prompt){toast('该条目没有提示词');return;}
      const done=()=>{toast('提示词已复制');card.classList.add('copying');setTimeout(()=>card.classList.remove('copying'),600);};
      if(navigator.clipboard){navigator.clipboard.writeText(e.prompt).then(done).catch(()=>toast('复制失败'));}
      else toast('浏览器不支持自动复制');
    };
    fillCardMedia(card,state.entries.find(e=>e.id===Number(card.dataset.id)));
  });
}
function renderAll(){applyTheme();renderCats();renderTags();renderList();}

let detailId=null;
async function openDetail(id){
  const e=state.entries.find(x=>x.id===id);if(!e)return;
  detailId=id;
  document.getElementById('d_title').textContent=e.title;
  document.getElementById('d_meta').innerHTML=(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+` <span style="color:var(--muted);font-size:12px">${esc(e.category||'')} · ${e.date||''}</span>`;
  document.getElementById('d_prompt').textContent=e.prompt||'（空）';
  const mb=document.getElementById('d_mediaBlock'),dm=document.getElementById('d_media');
  if(e.media&&e.media.length){
    dm.innerHTML='';mb.style.display='';
    for(const m of e.media){
      const it=document.createElement('div');it.className='mediaItem';
      if(m.kind==='link'){
        const a=document.createElement('a');a.href=m.url;a.target='_blank';a.textContent='🔗 '+vidLabel(m.url);a.style.cssText='display:block;padding:8px;font-size:12px;color:var(--brand)';it.appendChild(a);
      }else{
        const u=await mediaUrl(m);
        if(u){
          if(m.kind==='image'){const img=document.createElement('img');img.src=u;it.appendChild(img);}
          else{const v=document.createElement('video');v.src=u;v.muted=true;v.controls=true;it.appendChild(v);}
        }else{const d=document.createElement('div');d.textContent='媒体缺失';d.className='mi-info';it.appendChild(d);}
        const info=document.createElement('div');info.className='mi-info';info.textContent=m.name||m.kind;it.appendChild(info);
      }
      dm.appendChild(it);
    }
  }else mb.style.display='none';
  const sb=document.getElementById('d_scriptBlock');
  if(e.script){document.getElementById('d_script').textContent=e.script;sb.style.display='';}else sb.style.display='none';
  document.getElementById('detailMask').classList.add('show');
}

let editingMedia=[];
function openEditor(id){
  const e=id?state.entries.find(x=>x.id===id):null;
  state.editingId=id||null;
  editingMedia=e&&e.media?e.media.map(m=>({...m})):[];
  document.getElementById('editorTitle').textContent=e?'编辑条目':'新建条目';
  document.getElementById('f_title').value=e?e.title:'';
  document.getElementById('f_cat').value=e?e.category:state.categories[0];
  document.getElementById('f_tags').value=e?(e.tags||[]).join(','):'';
  document.getElementById('f_prompt').value=e?e.prompt:'';
  document.getElementById('f_script').value=e?e.script:'';
  document.getElementById('f_vlink').value='';
  document.getElementById('btnDelete').style.display=id?'':'none';
  renderEditorMedia();
  document.getElementById('editorMask').classList.add('show');
}
async function renderEditorMedia(){
  const bar=document.getElementById('editorMedia');
  bar.innerHTML='';
  for(const m of editingMedia){
    const it=document.createElement('div');it.className='mediaItem';
    const rm=document.createElement('button');rm.className='mi-rm';rm.textContent='✕';
    rm.onclick=async()=>{if(m.kind!=='link')await delMedia(m.id);editingMedia=editingMedia.filter(x=>x!==m);renderEditorMedia();};
    it.appendChild(rm);
    if(m.kind==='link'){
      const a=document.createElement('div');a.className='mi-info';a.textContent='🔗 '+vidLabel(m.url);a.style.padding='8px';it.appendChild(a);
    }else{
      const u=await mediaUrl(m);
      if(u){
        if(m.kind==='image'){const img=document.createElement('img');img.src=u;it.appendChild(img);}
        else{const v=document.createElement('video');v.src=u;v.muted=true;it.appendChild(v);}
      }
      const info=document.createElement('div');info.className='mi-info';info.textContent=m.name||m.kind;it.appendChild(info);
    }
    bar.appendChild(it);
  }
}
document.getElementById('btnAddImg').onclick=()=>document.getElementById('imgFile').click();
document.getElementById('imgFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const id=await putMedia(f,f.name,f.type);
  editingMedia.push({kind:'image',id:id,name:f.name});
  renderEditorMedia();toast('图片已添加');
};
document.getElementById('btnAddVid').onclick=()=>document.getElementById('vidFile').click();
document.getElementById('vidFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const id=await putMedia(f,f.name,f.type);
  editingMedia.push({kind:'video',id:id,name:f.name});
  renderEditorMedia();toast('本地视频已添加');
};
document.getElementById('btnAddLink').onclick=()=>{
  const u=document.getElementById('f_vlink').value.trim();
  if(!u){toast('请输入链接');return;}
  editingMedia.push({kind:'link',url:u});
  document.getElementById('f_vlink').value='';
  renderEditorMedia();
};
function saveEditor(){
  const title=document.getElementById('f_title').value.trim();
  if(!title){toast('标题不能为空');return;}
  const obj={title,
    category:document.getElementById('f_cat').value||'通用提示词',
    tags:document.getElementById('f_tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    media:editingMedia,
    prompt:document.getElementById('f_prompt').value,
    script:document.getElementById('f_script').value,
    date:new Date().toISOString().slice(0,10)};
  if(state.editingId){Object.assign(state.entries.find(x=>x.id===state.editingId),obj);}
  else state.entries.push({id:uid(),...obj});
  save();renderAll();closeEditor();toast('已保存');
}
function closeEditor(){document.getElementById('editorMask').classList.remove('show');state.editingId=null;editingMedia=[];}
async function delEntry(){
  if(!state.editingId)return;
  const e=state.entries.find(x=>x.id===state.editingId);
  if(e&&e.media){for(const m of e.media){if(m.kind!=='link')await delMedia(m.id);}}
  state.entries=state.entries.filter(x=>x.id!==state.editingId);
  save();renderAll();closeEditor();toast('已删除');
}

function addCat(){const n=prompt('新分类名称：');if(n&&n.trim()&&!state.categories.includes(n.trim())){state.categories.push(n.trim());save();renderCats();}}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='提示词创作库-备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('已导出（注：图片/视频存浏览器本地，不在JSON里）');
}
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      const entries=Array.isArray(data)?data:(data.entries||[]);
      const cats=Array.isArray(data.categories)&&data.categories.length?data.categories:['通用提示词','特定场景','剧本分镜','参考库'];
      if(confirm('导入 '+entries.length+' 条？\n确定=合并；取消=覆盖')){
        const seen=new Set(state.entries.map(e=>e.id));entries.forEach(e=>{if(!seen.has(e.id)){state.entries.push(e);seen.add(e.id);}});
      }else state.entries=entries;
      state.entries.forEach(e=>{if(!e.media)e.media=[];});
      state.categories=cats;save();renderAll();toast('导入完成（媒体文件需在本浏览器内重新上传）');
    }catch(e){toast('导入失败：JSON 格式错误');}
  };
  fr.readAsText(file);
}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

/* ===== 图片悬停预览小框 ===== */
let _pv=null;
function previewEl(){
  if(!_pv){_pv=document.createElement('div');_pv.className='img-preview';document.body.appendChild(_pv);}
  return _pv;
}
function showImgPreview(src){
  const pv=previewEl();
  pv.innerHTML='<img src="'+src+'" alt="">';
  pv.style.display='flex';
}
function moveImgPreview(e){
  const pv=previewEl();
  const pad=14,w=320,h=360;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>window.innerWidth)x=e.clientX-w-pad;
  if(y+h>window.innerHeight)y=e.clientY-h-pad;
  pv.style.left=x+'px';pv.style.top=y+'px';
}
function hideImgPreview(){if(_pv)_pv.style.display='none';}

document.getElementById('btnNew').onclick=()=>openEditor(null);
document.getElementById('btnCancel').onclick=closeEditor;
document.getElementById('btnCloseEditor').onclick=closeEditor;
document.getElementById('btnSave').onclick=saveEditor;
document.getElementById('btnDelete').onclick=delEntry;
document.getElementById('btnCloseDetail').onclick=()=>document.getElementById('detailMask').classList.remove('show');
document.getElementById('btnEdit').onclick=()=>{document.getElementById('detailMask').classList.remove('show');openEditor(detailId);};
document.getElementById('btnCopy').onclick=()=>{
  const e=state.entries.find(x=>x.id===detailId);
  if(!e||!e.prompt){toast('该条目没有提示词');return;}
  if(navigator.clipboard){navigator.clipboard.writeText(e.prompt).then(()=>toast('提示词已复制')).catch(()=>toast('复制失败'));}
  else toast('浏览器不支持自动复制');
};
document.getElementById('searchBox').oninput=e=>{state.search=e.target.value;renderList();};
document.getElementById('btnExport').onclick=exportJSON;
document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';};
document.getElementById('btnAddCat').onclick=addCat;
document.getElementById('themeSwitch').onclick=toggleTheme;
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',ev=>{if(ev.target===m)m.classList.remove('show');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-mask.show').forEach(m=>m.classList.remove('show'));});

load();renderAll();
</script>
